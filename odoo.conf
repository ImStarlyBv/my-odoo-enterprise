[options]
; Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False

; Admin password (change this in production!)
admin_passwd = admin

; Paths
addons_path = /opt/odoo/enterprise/extra-addons,/opt/odoo/enterprise/addons,/opt/odoo/enterprise/odoo/addons
data_dir = /opt/odoo/data

; Logging
; logfile intentionally omitted — Odoo logs to stdout so 'docker compose logs' works
log_level = info

; Workers (set to 0 for development, use gevent for async)
workers = 0

; HTTP
http_port = 8069
longpolling_port = 8072

; Performance
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 60
limit_time_real = 120

; Proxy (set to True if behind nginx/traefik)
proxy_mode = False
